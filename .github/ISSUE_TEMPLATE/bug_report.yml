name: Ошибка или замечание
description: Сообщить о неверном результате проверки, сбое запуска или неточности документации
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Не публикуйте пароли, ключи и содержимое /etc/shadow. Об уязвимостях сообщайте закрыто: см. SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Версия
      description: Вывод `bash securelinux-audit.sh --version`, строка VERSION
      placeholder: "1.0.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: ОС и вариант установки
      placeholder: "Debian 13, сервер"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Команда запуска и код выхода
      placeholder: "bash securelinux-audit.sh --check --format pdf; код 1"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Что произошло и что ожидалось
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Фрагмент вывода или отчёта
      description: Строки таблицы с проблемным пунктом или фрагмент JSON-отчёта
      render: text
  - type: textarea
    id: buildinfo
    attributes:
      label: Вывод --build-info
      render: text
